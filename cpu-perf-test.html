<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Intro to map components - Create a 2D map | Sample | ArcGIS Maps SDK for JavaScript</title>

    <!-- Load the ArcGIS Maps SDK for JavaScript from CDN -->
    <script type="module" src="https://js.arcgis.com/5.1/"></script>

    <style>
    :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --border: #d8dde3;
        --text: #1e2227;
        --muted: #5a6470;
        --accent: #2563eb;
        --tier-0: #6b7280;
        --tier-1: #ef4444;
        --tier-2: #f59e0b;
        --tier-3: #10b981;
        --tier-4: #2563eb;
      }      
      html,
      body {
        height: 100%;
        margin: 0;
      }
      .dt1 {
        margin-left: 10px;
        display: grid;
        gap: 0.35rem;
      }
      .label {
        color: var(--muted);
        font-size: 1rem;
      }      
      .result-grid {
        display: grid;
        grid-template-columns: repeat(3, max-content);
        justify-content: start;
        gap: 1rem 0.75rem;
        align-items: start;
      }
      .result-grid dt {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .result-grid dd {
        margin: 0;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        word-break: break-word;
      }  
      .status-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.15rem 0.65rem;
        border-radius: 9999px;
        font-weight: 600;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.85rem;
        line-height: 1.4;
      }      
      .pressure-nominal { background: #ffffff; color: #1e2227; border: 1px solid var(--border); }
      .pressure-fair { background: var(--tier-3); color: white; }
      .pressure-serious { background: var(--tier-2); color: white; }
      .pressure-critical { background: var(--tier-1); color: white; }      
    </style>
  </head>

  <body>
    <div class="result-grid">
      <div class="dt1">
        <div class="label">Compute cpu pressure</div>
        <div id="pressure-state">Checking...</div>
      </div>

      <div class="dt1">
        <div class="label">navigator.cpuPerformance</div>
        <div id="cpu-tier">Checking...</div>
        <div id="cpu-description"></div>
      </div>

      <div class="dt1">
        <div class="label">navigator.hardwareConcurrency</div>
        <div id="hardware-concurrency">Checking...</div>
      </div>
    </div>   
    <arcgis-map basemap="topo-vector" zoom="4" center="15, 65">
      <arcgis-zoom slot="top-left"></arcgis-zoom>
    </arcgis-map>
    <script type="module">
      const hasCpuPerformance = 'cpuPerformance' in navigator;
      const hasComputePressure = 'PressureObserver' in window;  
      console.log("hasComputePressure:", hasComputePressure);

      const updateResults = () => {
        document.getElementById("cpu-tier").textContent = hasCpuPerformance ? "Supported" : "Not supported";
        document.getElementById("pressure-state").textContent = hasComputePressure ? "Supported" : "Not supported";
        console.log("Known sources", PressureObserver.knownSources);
      };
      updateResults();   

      // https://github.com/WICG/cpu-performance

      const cpuValues = {
        1: "Low end device",
        2: "Mid-low end device",
        3: "Mid-high end device",
        4: "High end device",
        0: "Unknown device"
      }

      // Get a reference to the map component
      const viewElement = document.querySelector("arcgis-map");
      const tierElement = document.getElementById('cpu-tier');
      const cpuDescriptionElement = document.getElementById('cpu-description');
      cpuDescriptionElement.textContent = cpuValues[navigator.cpuPerformance];
      const pressureElement = document.getElementById('pressure-state');  

      // Wait until the map view is ready
      await viewElement.viewOnReady();
      console.log("Map component is ready");
      // https://developer.mozilla.org/en-US/docs/Web/API/Navigator/hardwareConcurrency
      document.getElementById("hardware-concurrency").textContent = navigator.hardwareConcurrency;
      console.log("Hardware concurrency:", navigator.hardwareConcurrency);

      const updateCpuPressure = (state) => {
        pressureElement.replaceChildren();
        const badge = document.createElement('span');
        const validStates = ['nominal', 'fair', 'serious', 'critical'];
        const stateClass = validStates.includes(state) ? state : 'nominal';
        badge.className = `status-badge pressure-${stateClass}`;
        badge.textContent = state;
        pressureElement.append(badge);
      }  

      const observePressure = () => {
        console.log("Starting to observe CPU pressure...");
        let lastCpuPressure = "unknown";
        if (!hasComputePressure) {
          console.error('PressureObserver is not supported in this browser.');
          return;
        }
        try {
          const cpuCallback = (entries) => {
            try {
              const state = entries[entries.length - 1].state;
              if (lastCpuPressure !== state) {
                console.log(`CPU pressure changed: from=${lastCpuPressure} to=${state}`);
                updateCpuPressure(state);
              }
              lastCpuPressure = state;
            }
            catch (error) {
              console.error('Error processing pressure update:', error);
              cpuObserver.disconnect();
            }
          };

          const cpuObserver = new PressureObserver(cpuCallback);
          cpuObserver.observe("cpu", { sampleInterval: 1000 }); // 1000ms
          return cpuObserver;
        } catch (error) {
          console.error('Error initializing CPU PressureObserver:', error);
        } 
      };
      observePressure();
    </script>
  </body>
</html>
